version = 1
SPDX-PackageName = "koh/sylius-acp"
SPDX-PackageSupplier = "Kai Ole Hartwig <mail@ole-hartwig.eu>"
SPDX-PackageDownloadLocation = "https://github.com/ohartwig/sylius-acp"

# Config, metadata and repo-template files. They carry no comment syntax that
# survives their own tooling (composer.json, JSON-like configs) or are copied
# verbatim from devops/repo-templates, where a per-file header would drift from
# the source on the next sync. Declaring them here keeps `reuse lint` blocking
# without littering generated files with headers.
[[annotations]]
path = [
    "CHANGELOG.md",
    ".gitattributes",
    ".gitignore",
    "composer.json",
    "renovate.json",
    "phpstan.neon",
    "phpunit.xml.dist",
    "SECURITY.md",
    ".well-known/security.txt",
    ".gitlab/**",
    ".mise.toml",
    ".gitsigners.d/**",
    "lefthook.yml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Kai Ole Hartwig"
SPDX-License-Identifier = "MIT"

# The ACP 2026-04-17 feed JSON schema, copied unchanged from
# github.com/agentic-commerce-protocol/agentic-commerce-protocol
# (spec/2026-04-17/json-schema/schema.feed.json) to validate test output.
[[annotations]]
path = ["tests/Fixtures/acp/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2025 OpenAI", "2025 Stripe"]
SPDX-License-Identifier = "Apache-2.0"
